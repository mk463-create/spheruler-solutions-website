      function DefaultValues()
   {
    var Row; var Col;      var Row_Right; var Col_Right; 
    var Row_Left; var Col_Left;
    var Row_Top; var Col_Top;
    var Row_Bottom; var Col_Bottom;
    var Ind_Inp;
	
        for (Row=0;Row<2*Enc_Cir_Rad;Row++)     {
     Col_Left_Cir[Row]=Enc_Cir_Rad-1;
     Col_Right_Cir[Row]=Enc_Cir_Rad; 
          for (Col=0;Col<2*Enc_Cir_Rad;Col++)      {
            if (((Row-Enc_Cir_Rad+0.5)*(Row-Enc_Cir_Rad+0.5)+(Col-Enc_Cir_Rad+0.5)*(Col-Enc_Cir_Rad+0.5))<(Enc_Cir_Rad*Enc_Cir_Rad))
      {
	      if (Col<Col_Left_Cir[Row]) Col_Left_Cir[Row]=Col;
       if (Col>Col_Right_Cir[Row]) Col_Right_Cir[Row]=Col;
      }
     }	  
    }

    for (Row=0;Row<2*Enc_Cir_Rad;Row++)     {
          for (Col=Col_Left_Cir[Row];Col<=2*Enc_Cir_Rad+Col_Right_Cir[Row];Col++)
     {
            if (Col==(Col_Right_Cir[Row]+1)) Col=2*Enc_Cir_Rad+Col_Left_Cir[Row];
      
            Row_Right=Row;
      Col_Right=Col+1;
            if (Col==Col_Right_Cir[Row]) Col_Right=2*Enc_Cir_Rad+Col_Left_Cir[Row];
      if ((Col-2*Enc_Cir_Rad)==Col_Right_Cir[Row]) Col_Right=Col_Left_Cir[Row];
            Ind_Inp=Enc_Img_Width*Row+Col;
      Ind_Inp_Right[Ind_Inp]=Enc_Img_Width*Row_Right+Col_Right;
      
                  Row_Top=Row-1; Col_Top=Col;       if (Row==0) { Row_Top=0; Col_Top=Enc_Img_Width-1-Col; }       else
      {
       if (Col<Enc_Cir_Rad)        {
                if ( (Row<Enc_Cir_Rad) && (Col<Col_Left_Cir[Row-1]) ) Col_Top=Col_Left_Cir[Row-1];
       }        else
       {
                        if (Col<2*Enc_Cir_Rad)
        { 
                  if ( (Row<Enc_Cir_Rad) && (Col>=Col_Right_Cir[Row-1] ) ) Col_Top=Col_Right_Cir[Row-1];
                  if ( (Row>Enc_Cir_Rad) && (Col==Col_Right_Cir[Row] ) ) Col_Top=Col_Right_Cir[Row-1];
        }
        else
        {
                           if (Col<3*Enc_Cir_Rad) 
         { 
                              if ( (Row<Enc_Cir_Rad) && ((Col-2*Enc_Cir_Rad)<Col_Left_Cir[Row-1]) ) Col_Top=2*Enc_Cir_Rad+Col_Left_Cir[Row-1]; 
         }
         else 
         {
                    if ( (Row<Enc_Cir_Rad) && ((Col-2*Enc_Cir_Rad)>Col_Right_Cir[Row-1]) ) Col_Top=2*Enc_Cir_Rad+Col_Right_Cir[Row-1];
                    if ( (Row>Enc_Cir_Rad) && ((Col-2*Enc_Cir_Rad)==Col_Right_Cir[Row] ) ) Col_Top=2*Enc_Cir_Rad+Col_Right_Cir[Row-1];
         }
        }
       }
      }
      Ind_Inp_Top[Ind_Inp]=Enc_Img_Width*Row_Top+Col_Top;
      
      Row_Left=Row;
      Col_Left=Col-1;
      if (Col==Col_Left_Cir[Row]) Col_Left=2*Enc_Cir_Rad+Col_Right_Cir[Row];
      if ((Col-2*Enc_Cir_Rad)==Col_Left_Cir[Row]) Col_Left=Col_Right_Cir[Row];
      Ind_Inp_Left[Ind_Inp]=Enc_Img_Width*Row_Left+Col_Left;
      
      Row_Bottom=Row+1; Col_Bottom=Col;       if (Row==2*Enc_Cir_Rad) { Row_Bottom=2*Enc_Cir_Rad; Col_Bottom=Enc_Img_Width-1-Col; }       else
      {
              if (Col<Enc_Cir_Rad)
       { 
                if ( (Row<Enc_Cir_Rad) && (Col==Col_Left_Cir[Row]) ) Col_Bottom=Col_Left_Cir[Row+1]; 
                if ( (Row>Enc_Cir_Rad) && (Col<Col_Left_Cir[Row+1]) ) Col_Bottom=Col_Left_Cir[Row+1]; 
       }
       else
       {
                        if (Col<2*Enc_Cir_Rad)
        {
                  if ( (Row>Enc_Cir_Rad) && (Col>Col_Right_Cir[Row+1]) ) Col_Bottom=Col_Right_Cir[Row+1];
        }
        else
        {         if (Col<3*Enc_Cir_Rad)
         {
                    if ( (Row<Enc_Cir_Rad) && ((Col-2*Enc_Cir_Rad)==Col_Left_Cir[Row]) ) Col_Bottom=2*Enc_Cir_Rad+Col_Left_Cir[Row+1];
          if ( (Row>Enc_Cir_Rad) && ((Col-2*Enc_Cir_Rad)<Col_Left_Cir[Row+1]) ) Col_Bottom=2*Enc_Cir_Rad+Col_Left_Cir[Row+1]; 
         }
         else 
         { 
                    if ( (Row>Enc_Cir_Rad) && ((Col-2*Enc_Cir_Rad)>Col_Right_Cir[Row+1]) ) Col_Bottom=2*Enc_Cir_Rad+Col_Right_Cir[Row+1]; 
         }         }
       }
      }
      Ind_Inp_Bottom[Ind_Inp]=Enc_Img_Width*Row_Bottom+Col_Bottom;
     }
    }     
       }
						
      function InputImg_Check()
   {
    var Row; var Col;     var Hor_S; var Ver_S;     var X; var Y; var Z;         var Ind_Inp;     var r; var g; var b; var d;     var Scal_Fact;
        var Pix_Place=2;
   
    FCFI_Chk=1;      Kind=0;     Mark_Chk=false;
		
    if ( (Pix_Inp[0]!=52) && (Pix_Inp[1]!=52) && (Pix_Inp[2]!=52) ) FCFI_Chk=0;     if ( (Pix_Inp[4]!=67) && (Pix_Inp[5]!=67) && (Pix_Inp[6]!=67) ) FCFI_Chk=0;     if ( (Pix_Inp[8]!=70) && (Pix_Inp[9]!=70) && (Pix_Inp[10]!=70) ) FCFI_Chk=0;     if ( (Pix_Inp[12]!=73) && (Pix_Inp[13]!=73) && (Pix_Inp[14]!=73) ) FCFI_Chk=0;     if ( (Pix_Inp[60]==49) && (Pix_Inp[61]==49) && (Pix_Inp[62]==49) ) Kind=1;         if ( (Pix_Inp[60]==50) && (Pix_Inp[61]==50) && (Pix_Inp[62]==50) ) Kind=2;     	
    if (Kind==1)     {
     Scal_Fact=Out_Img_Siz_Def/250;
     
     for (Row=0;Row<2*Enc_Cir_Rad;Row++)      {
      Ver_S=(-Enc_Cir_Rad+0.5+Row)/Enc_Cir_Rad;       for (Col=Col_Left_Cir[Row];Col<=2*Enc_Cir_Rad+Col_Right_Cir[Row];Col++)       {
              if (Col==(Col_Right_Cir[Row]+1)) Col=2*Enc_Cir_Rad+Col_Left_Cir[Row]; 
              if (Col<2*Enc_Cir_Rad) Hor_S=(-Enc_Cir_Rad+0.5+Col)/Enc_Cir_Rad;        else Hor_S=(-3*Enc_Cir_Rad+0.5+Col)/Enc_Cir_Rad;        Ind_Inp=Enc_Img_Width*(2*Enc_Cir_Rad-1-Row)+Col;	   	  
       X=-1.0+(2.0/(1.0+Hor_S*Hor_S+Ver_S*Ver_S));        Y=Hor_S*(1.0+X);        Z=Ver_S*(1.0+X);
       if (Col>=2*Enc_Cir_Rad)        { X=-X; Y=-Y; }        
              r=Pix_Inp[4*Ind_Inp]; g=Pix_Inp[4*Ind_Inp+1]-r; b=Pix_Inp[4*Ind_Inp+2]-r; 
                                   d=Scal_Fact*(r+0.1*(b-0.5*g*g+4.5*g));
              X_Inp[Ind_Inp]=X;
       Y_Inp[Ind_Inp]=Y;
       Z_Inp[Ind_Inp]=Z;
       D_Inp[Ind_Inp]=d;				
      }
     }
     
     r=Pix_Inp[4*Enc_Img_Width]; g=Pix_Inp[4*Enc_Img_Width+1]; b=Pix_Inp[4*Enc_Img_Width+2];      if ( (r==77) && (g==r) && (b==r) )      {
      r=Pix_Inp[4*Enc_Img_Width+4]; g=Pix_Inp[4*Enc_Img_Width+5]; b=Pix_Inp[4*Enc_Img_Width+6];       if ((r==g) && (r==b))
      {
       Mark_Len=r;
       Mark_Chk=true;
       
       r=Pix_Inp[4*Enc_Img_Width+8]; g=Pix_Inp[4*Enc_Img_Width+9]; b=Pix_Inp[4*Enc_Img_Width+10];
       while ( (r!=255) && (g==r) && (b==r) && (Pix_Place<50) )        {
        if ( (r==32) || (r==28) || (r==29) || (r==30) || (r==31) ) Marker_Text+=" ";         else Marker_Text+=String.fromCharCode(r);         Pix_Place++;
        r=Pix_Inp[4*Enc_Img_Width+4*Pix_Place]; g=Pix_Inp[4*Enc_Img_Width+4*Pix_Place+1]; b=Pix_Inp[4*Enc_Img_Width+4*Pix_Place+2];        } 
      }
     }
    }
    if (FCFI_Chk==0)
    {
     document.getElementById('3DView_Initial_Position_Id').style.visibility='hidden';
     document.getElementById('Rotate_Id').style.visibility='hidden';
     document.getElementById('Displace_Id').style.visibility='hidden';
     document.getElementById('FreeDraw_Id').style.visibility='hidden';
     document.getElementById('TextWrite_Id').style.visibility='hidden';
     document.getElementById('Embed_Id').style.visibility='hidden';
     document.getElementById('Pen_Thick_Id').style.visibility='hidden';
     document.getElementById('FavColor_Id').style.visibility='hidden';
     document.getElementById('Font_Size_Id').style.visibility='hidden';
     document.getElementById('Text_Content_Id').style.visibility='visible';
     Text_Content_Id.value='Error in Input Coded Image!'
    }
    
    if (FCFI_Chk==1)
    {
     Anim_Play=true; 
     Rot_Ang=Rot_Ang_Tmp;
     document.getElementById('Output').style.cursor='pointer';
     UserMode=1; ViewModeOpt=1;
     Shft_Net_y=0; Shft_Net_z=0;
     Qp0=1.0; Qp1=0.0; Qp2=0.0; Qp3=0.0;
     Mag=1.0; View_Dist=100.0;
     HideColSize();
     document.getElementById('3DView_Initial_Position_Id').src='Images/Buttons/Initial.png';
     document.getElementById('3DView_Initial_Position_Id').style.visibility='visible';
     document.getElementById('Rotate_Id').style.visibility='visible';
     document.getElementById('Displace_Id').style.visibility='visible';
     document.getElementById('FreeDraw_Id').style.visibility='visible';
     document.getElementById('TextWrite_Id').style.visibility='visible';
     ButtonWhiteBorders();
     document.getElementById('Rotate_Id').style.border = '3px solid #00FF00';
    }
   }

                if (Col==(Col_Right_Cir[Row]+1)) Col=2*Enc_Cir_Rad+Col_Left_Cir[Row];

      function OutputImage()
   {
        var Row; var Col; var Ind_Inp; var Ind_Out;
    var Mark_Pxls;     
    var Qa0; var Qa1; var Qa2; var Qa3;         var Qt0; var Qt1; var Qt2;	var Qt3;
   
        if ( (FCFI_Chk==1) && (Kind!=0) && (UserMode==1) ) 
    {
     Ctx_Out.fillStyle='#FFFFFF';      Ctx_Out.fillRect(0,0,Out_Img_Width,Out_Img_Win_Height); 	 
     ImgData_Out=Ctx_Out.getImageData(0,0,Out_Img_Width,Out_Img_Win_Height);      Pix_Out=ImgData_Out.data; 	 
          switch(RotMode)
     {
      case 1: { Rot_Axis_x=-1.0; Rot_Axis_y=0.0; Rot_Axis_z=0.0; break; }       case 2: { Rot_Axis_x=1.0; Rot_Axis_y=0.0; Rot_Axis_z=0.0; break; }       case 3: { Rot_Axis_x=0.0; Rot_Axis_y=0.0; Rot_Axis_z=-1.0; break; }       case 4: { Rot_Axis_x=0.0; Rot_Axis_y=0.0; Rot_Axis_z=1.0; break; }       case 5: { Rot_Axis_x=0.0; Rot_Axis_y=-1.0; Rot_Axis_z=0.0; break; }       case 6: { Rot_Axis_x=0.0; Rot_Axis_y=1.0; Rot_Axis_z=0.0; break; }       case 7: { Qp0=Qtp0; Qp1=Qtp1; Qp2=Qtp2; Qp3=Qtp3; break; }
     }

          Qa0=Math.cos(Rot_Ang/2); 
     Qa1=Math.sin(Rot_Ang/2)*Rot_Axis_x;
     Qa2=Math.sin(Rot_Ang/2)*Rot_Axis_y;
     Qa3=Math.sin(Rot_Ang/2)*Rot_Axis_z;
     
          Qt0=Qa0*Qp0-Qa1*Qp1-Qa2*Qp2-Qa3*Qp3;
     Qt1=Qa0*Qp1+Qa1*Qp0+Qa2*Qp3-Qa3*Qp2;
     Qt2=Qa0*Qp2+Qa2*Qp0+Qa3*Qp1-Qa1*Qp3;
     Qt3=Qa0*Qp3+Qa3*Qp0+Qa1*Qp2-Qa2*Qp1;
     Qp0=Qt0; Qp1=Qt1; Qp2=Qt2; Qp3=Qt3;

     }

    for (Row=0;Row<Enc_Cir_Dia;Row++)

         x3=x_Out[Ind_Inp_B];

         r3=Pix_Inp[Ind_Inp_Mat];
         g3=Pix_Inp[Ind_Inp_Mat+1]; 
         b3=Pix_Inp[Ind_Inp_Mat+2];       
        }
        
        ys_min=ys1; if (ys2<ys_min) ys_min=ys2; if (ys3<ys_min) ys_min=ys3; ys_min=Math.round(ys_min);
        ys_max=ys1; if (ys2>ys_max) ys_max=ys2; if (ys3>ys_max) ys_max=ys3; ys_max=Math.round(ys_max);
        
        if (ys_max>ys_min)        {

                    y23=ys2-ys3; z23=zs2-zs3; f23=ys2*zs3-ys3*zs2;
          Den=ys1*z23-zs1*y23+f23;
          y23=y23/Den; z23=z23/Den; f23=f23/Den;

                            {

   function TouchMove(Ev)
   {
    var P1M_Hor, P1M_Ver, P2M_Hor, P2M_Ver;
    var MagP12, MagP12M, P12_Hor, P12_Ver, P12M_Hor, P12M_Ver;
	   var Fact1;
   
    Ev.stopPropagation(); Ev.preventDefault();
    if ((Ev.touches.length==1) )
    {
     if ( ((UserMode==1) || (UserMode==2) || (UserMode==3)) && (Touch1_Status==true) )
     {
      Touch1Moved_Status=true;

      MouseTouch_Move_Row=Math.round(Ev.touches[0].clientY-Can_Out.getBoundingClientRect().top);
      MouseTouchMove();
     }
     else Touch1_Status=false;
    }
    
    if ((Ev.touches.length==2) )
    {
     if ( (UserMode==1) && (Touch2_Status==true) && (Touch2_OnObject==true) )
     {
      Touch2Moved_Status=true;
	  
      MouseTouch_Start_Col=Math.round(Ev.touches[0].clientX-Can_Out.getBoundingClientRect().left);
      MouseTouch_Start_Row=Math.round(Ev.touches[0].clientY-Can_Out.getBoundingClientRect().top);
      P1M_Hor=MouseTouch_Start_Col-0.5*Out_Img_Width+0.5;
      P1M_Ver=-(MouseTouch_Start_Row-0.5*Out_Img_Height+0.5);
      
      MouseTouch_Start_Col=Math.round(Ev.touches[1].clientX-Can_Out.getBoundingClientRect().left);
      MouseTouch_Start_Row=Math.round(Ev.touches[1].clientY-Can_Out.getBoundingClientRect().top);
      P2M_Hor=MouseTouch_Start_Col-0.5*Out_Img_Width+0.5;
      P2M_Ver=-(MouseTouch_Start_Row-0.5*Out_Img_Height+0.5);

      MagP12=Math.sqrt((P2_Hor-P1_Hor)*(P2_Hor-P1_Hor)+(P2_Ver-P1_Ver)*(P2_Ver-P1_Ver));
      MagP12M=Math.sqrt((P2M_Hor-P1M_Hor)*(P2M_Hor-P1M_Hor)+(P2M_Ver-P1M_Ver)*(P2M_Ver-P1M_Ver));
      Mag_Mul=MagP12M/MagP12;
	        if ( (MagT*Mag_Mul>0.25) && (MagT*Mag_Mul<4) )
      {
       Mag=MagT*Mag_Mul;
       P12_Hor=P2_Hor-P1_Hor; P12_Ver=P2_Ver-P1_Ver;
       P12M_Hor=P2M_Hor-P1M_Hor; P12M_Ver=P2M_Ver-P1M_Ver;
       Rot_Ang=Math.acos((P12_Hor*P12M_Hor+P12_Ver*P12M_Ver)/(MagP12*MagP12M));
       if (P12_Hor*P12M_Ver<P12_Ver*P12M_Hor) Rot_Ang=-Rot_Ang;
       Rot_Axis_x=1.0; Rot_Axis_y=0.0; Rot_Axis_z=0.0;
       RotMode=7;
	   
	  	   Fact1=(View_Dist-(Touch2_Start_x/Enc_Cir_Rad))/View_Dist; 
	   
       Shft_Net_y=Shft_Net_y_tmp+((P1M_Hor/Mag_Mul)-P1_Hor*Math.cos(Rot_Ang)+P1_Ver*Math.sin(Rot_Ang))*Fact1/Mag;
       Shft_Net_z=Shft_Net_z_tmp+((P1M_Ver/Mag_Mul)-P1_Hor*Math.sin(Rot_Ang)-P1_Ver*Math.cos(Rot_Ang))*Fact1/Mag;
       document.getElementById('Rotate_Id').style.border='3px solid #00FF00';
       document.getElementById('Displace_Id').style.border='3px solid #00FF00';
       document.getElementById('Rotate_Id').src='Images/Buttons/Rotate.png';
       document.getElementById('Displace_Id').src='Images/Buttons/Displace.png';
       OutputImage();
      }
	  	  
	       }
     else Touch2_Status=false;
    }
   }   
  
   function MouseTouchMove()
   {
    var Fact1; var Fact2; var Fact3;
    var a; var b; var c; var d;  var Det;
    var x1; var y1; var z1; var x2; var y2; var z2;
    var x; var y; var z; var Magn; var rx; var ry; var rz;

    MouseTouch_Move_Hor=MouseTouch_Move_Col-0.5*Out_Img_Width+0.5;
    MouseTouch_Move_Ver=-(MouseTouch_Move_Row-0.5*Out_Img_Height+0.5);
				
    if (UserMode==1)
    {
     if (ViewModeOpt==0) document.getElementById('Output').style.cursor='not-allowed';
     else
     {
      if ( (MouseDown_Status==true) || (Touch1_Status==true) )	
      {
       if (MouseTouch_OnObject==true)
       {			
        if (ViewModeOpt==1)
        {
         Fact2=MouseTouch_Move_Hor*MouseTouch_Move_Hor+MouseTouch_Move_Ver*MouseTouch_Move_Ver;
         Fact3=Mag*View_Dist*Enc_Cir_Rad;
         a=1+(Fact2/(Fact3*Fact3));
         b=-2*Fact2/(Mag*Fact3);
         b+=2*(MouseTouch_Move_Hor*Shft_Net_y+MouseTouch_Move_Ver*Shft_Net_z)/Fact3;
         								
         d=Math.pow(MouseTouch_Start_x,2)+Math.pow(MouseTouch_Start_y-Shft_Net_y,2)+Math.pow(MouseTouch_Start_z-Shft_Net_z,2);
 		
          								
         c=Math.pow((MouseTouch_Move_Hor/Mag)-Shft_Net_y,2)+Math.pow((MouseTouch_Move_Ver/Mag)-Shft_Net_z,2)-d;
 						
         Det=b*b-4*a*c;
         document.getElementById('Rotate_Id').src='Images/Buttons/Rotate.png';
         if (Det>=0)
         {
          x1=(-b+Math.sqrt(Det))/(2*a);
          Fact1=(View_Dist-(x1/Enc_Cir_Rad))/View_Dist;
          y1=(MouseTouch_Move_Hor*Fact1/Mag)-Shft_Net_y;
          z1=(MouseTouch_Move_Ver*Fact1/Mag)-Shft_Net_z;
 									
          x2=(-b-Math.sqrt(Det))/(2*a);
          Fact1=(View_Dist-(x2/Enc_Cir_Rad))/View_Dist;
          y2=(MouseTouch_Move_Hor*Fact1/Mag)-Shft_Net_y;
          z2=(MouseTouch_Move_Ver*Fact1/Mag)-Shft_Net_z;
	 								
          if ( (MouseTouch_Start_x*(x1-x2)+(MouseTouch_Start_y-Shft_Net_y)*(y1-y2)+(MouseTouch_Start_z-Shft_Net_z)*(z1-z2))>0)
          { 
           x=x1; y=y1; z=z1;
          }
          else
          {
           x=x2; y=y2; z=z2;
          }
          rx=(MouseTouch_Start_y-Shft_Net_y)*z-(MouseTouch_Start_z-Shft_Net_z)*y;
          ry=(MouseTouch_Start_z-Shft_Net_z)*x-MouseTouch_Start_x*z;
          rz=MouseTouch_Start_x*y-(MouseTouch_Start_y-Shft_Net_y)*x;
          Magn=Math.sqrt(rx*rx+ry*ry+rz*rz);
          Rot_Axis_x=rx/Magn;
          Rot_Axis_y=ry/Magn;
          Rot_Axis_z=rz/Magn;
          Rot_Ang=Math.acos((MouseTouch_Start_x*x+(MouseTouch_Start_y-Shft_Net_y)*y+(MouseTouch_Start_z-Shft_Net_z)*z)/d);
          RotMode=7;
          document.getElementById('Rotate_Id').style.border='3px solid #00FF00';
          document.getElementById('Output').style.cursor='crosshair';
                             }
         else 
         {
          document.getElementById('Rotate_Id').style.border='3px solid red';
          document.getElementById('Output').style.cursor='not-allowed';
         }
        }
        if (ViewModeOpt==2)
        {
         Fact1=(View_Dist-(MouseTouch_Start_x/Enc_Cir_Rad))/View_Dist; 							
         Shft_Net_y=Shft_Net_y_tmp+(MouseTouch_Move_Hor-MouseTouch_Start_Hor)*Fact1/Mag;
         Shft_Net_z=Shft_Net_z_tmp+(MouseTouch_Move_Ver-MouseTouch_Start_Ver)*Fact1/Mag;
         document.getElementById('Displace_Id').src='Images/Buttons/Displace.png';
         document.getElementById('Output').style.cursor='grabbing';
         document.getElementById('Displace_Id').style.border='3px solid #00FF00';
        }
        OutputImage();
       }
       else
       {
        document.getElementById('Output').style.cursor='not-allowed';
       }
      }
      else
      {
       if (Reso_Dist_Min[Out_Img_Width*(MouseTouch_Move_Row)+MouseTouch_Move_Col]>-15000.0)
       {
        if (ViewModeOpt==1) document.getElementById('Output').style.cursor='crosshair';
        if (ViewModeOpt==2) document.getElementById('Output').style.cursor='grab';
       }
       else
       {
        if ( Math.abs(MouseTouch_Move_Hor/Mag-Shft_Net_y)>Math.abs(MouseTouch_Move_Ver/Mag-Shft_Net_z) )
        {
         document.getElementById('Output').style.cursor='e-resize';
        }
        else
        {
         document.getElementById('Output').style.cursor='n-resize';
        }
       }
      }
     }
	    }
    else document.getElementById('Output').style.cursor='default';
    if ((UserMode==2) && ((MouseDown_Status==true) || (Touch1_Status==true)) )
    {
     Ctx_Out.lineWidth=Pen_Thick_Id.value;
     Ctx_Out.strokeStyle=FavColor_Id.value;
     Ctx_Out.moveTo(Stroke_Start_Col,Stroke_Start_Row);
     Ctx_Out.lineTo(MouseTouch_Move_Col,MouseTouch_Move_Row);
     Ctx_Out.stroke();
			
     Stroke_Start_Col=MouseTouch_Move_Col;
     Stroke_Start_Row=MouseTouch_Move_Row;
    }
   }

   }
   
   function Scroll(Ev)
   {
    Ev.preventDefault(); Ev.stopPropagation();
    Zoom_Pt_Col=Math.round(Ev.clientX-Can_Out.getBoundingClientRect().left);
    Zoom_Pt_Row=Math.round(Ev.clientY-Can_Out.getBoundingClientRect().top);
    if (UserMode==1)
    {
     if (ViewModeOpt==1)
     {
      if (Ev.deltaY>0) Mag_Mul=0.9;
      else Mag_Mul=1.1;
     }
     if (ViewModeOpt==2)
     {
      if (Ev.deltaY>0) ViewScrollCloser=false; else ViewScrollCloser=true;
     }
     ScaleZoomInOut();
    }
   }
	
   function ScaleZoomInOut()
   {
       var Zoom_Pt_y; var Zoom_Pt_z;
    var View_Dist_Tmp;
    var Fact1; var Fact2;
   
    Anim_Play=false;
    
    Zoom_Pt_y=Zoom_Pt_Col-0.5*Out_Img_Width+0.5;
    Zoom_Pt_z=-(Zoom_Pt_Row-0.5*Out_Img_Height+0.5);
    document.getElementById('3DView_Initial_Position_Id').style.border = '3px solid white';
    if (ViewModeOpt==1) document.getElementById('Rotate_Id').style.border = '3px solid red';
    if (ViewModeOpt==2) document.getElementById('Displace_Id').style.border = '3px solid red';
    
    if (ViewModeOpt==1)
    {
     if (Mag_Mul>1)  document.getElementById('Rotate_Id').src='Images/Buttons/LockEnlarge.png';
      else  document.getElementById('Rotate_Id').src='Images/Buttons/LockShrink.png';
     if (Reso_Dist_Min[Out_Img_Width*Zoom_Pt_Row+Zoom_Pt_Col]>-15000.0)
     {      
      if (Mag_Mul>1) document.getElementById('Output').style.cursor='zoom-in';
      else document.getElementById('Output').style.cursor='zoom-out';
      if ( (Mag*Mag_Mul>0.25) && (Mag*Mag_Mul<4) )
      {
       Fact1=(View_Dist-(Reso_Dist_Min[Out_Img_Width*Zoom_Pt_Row+Zoom_Pt_Col]/Enc_Cir_Rad))/(View_Dist*Mag);
       Shft_Net_y+=Zoom_Pt_y*Fact1*((1.0/Mag_Mul)-1);
       Shft_Net_z+=Zoom_Pt_z*Fact1*((1.0/Mag_Mul)-1);
       Mag=Mag*Mag_Mul;
      }
      else document.getElementById('Output').style.cursor='not-allowed';  
     }
     else document.getElementById('Output').style.cursor='not-allowed';
    }
    
    if (ViewModeOpt==2)
    {
     if (ViewScrollCloser) document.getElementById('Displace_Id').src='Images/Buttons/Closer.png';
     else document.getElementById('Displace_Id').src='Images/Buttons/Farther.png';
    
     if (Reso_Dist_Min[Out_Img_Width*Zoom_Pt_Row+Zoom_Pt_Col]>-15000.0)
     { 
      Fact1=Reso_Dist_Min[Out_Img_Width*Zoom_Pt_Row+Zoom_Pt_Col]/(Enc_Cir_Rad*Mag);
      if (ViewScrollCloser) 
      {
       document.getElementById('Output').style.cursor='zoom-in';
       if (View_Dist>2)
       { 
        if (View_Dist==100)
        {
         Shft_Net_y+=Zoom_Pt_y*Fact1*(0.01-0.1);
         Shft_Net_z+=Zoom_Pt_z*Fact1*(0.01-0.1);
         View_Dist=10; 
        }
        else
        {
         Shft_Net_y+=Zoom_Pt_y*Fact1*((1/View_Dist)-(1/(View_Dist-1)));
         Shft_Net_z+=Zoom_Pt_z*Fact1*((1/View_Dist)-(1/(View_Dist-1)));
         View_Dist-=1;
        }
       }
       else document.getElementById('Output').style.cursor='not-allowed';
      }
      else
      {
       document.getElementById('Output').style.cursor='zoom-out';
       if (View_Dist<100)
       {
        if (View_Dist==10)
        {
         Shft_Net_y+=Zoom_Pt_y*Fact1*(0.1-0.01);
         Shft_Net_z+=Zoom_Pt_z*Fact1*(0.1-0.01);
         View_Dist=100; 
        }
        else
        {
         Shft_Net_y+=Zoom_Pt_y*Fact1*((1/View_Dist)-(1/(View_Dist+1)));
         Shft_Net_z+=Zoom_Pt_z*Fact1*((1/View_Dist)-(1/(View_Dist+1)));
         View_Dist+=1;
        }
       }
       else document.getElementById('Output').style.cursor='not-allowed';
      }
     }
     else document.getElementById('Output').style.cursor='not-allowed';
    }      
    OutputImage();
   }
	
   function KeyDown(Ev)
   {
    if ((Ev.keyCode==16) && (UserMode==1) && (MouseDown_Status!=true)) DisplaceView();		
   }	  
			
   function FullScreen()
   {
    if (FullScreenOn==false)
    {
     if (FullScrElem.requestFullscreen) FullScrElem.requestFullscreen();
     else if (FullScrElem.mozRequestFullScreen) FullScrElem.mozRequestFullScreen();
     else if (FullScrElem.webkitRequestFullscreen) FullScrElem.webkitRequestFullscreen();
     else if (FullScrElem.msRequestFullscreen) FullScrElem.msRequestFullscreen();
     FullScreenOn=true;
     document.getElementById('FullScreen_Id').src='Images/Buttons/ExitScreen.png';
     document.getElementById('FullScreen_Id').title='Exit Full Screen';
    }
    else
    {
     if (document.exitFullscreen) document.exitFullscreen();
     else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
     else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
     else if (document.msExitFullscreen) document.msExitFullscreen();
     FullScreenOn=false;
     document.getElementById('FullScreen_Id').src='Images/Buttons/FullScreen.png';
     document.getElementById('FullScreen_Id').title='Full Screen';
    }    
   }
   if (performance.navigation.type == 1)
   {
    document.getElementById('Obj_Id').value=1;
    document.getElementById('Language_Id').value='ENG';
   }
